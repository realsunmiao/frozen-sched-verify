name: Cuttlefish Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  TIME_FACTOR: 6          # 10 min 实时 ≈ 1h 逻辑
  CUTTLEFISH_BRANCH: aosp-android-latest-release
jobs:
  verify:
    name: Verify on Cuttlefish (x86_64, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-tools curl unzip tar
      - name: Get latest build ID
        id: build_id
        env:
          TARGET: aosp_cf_x86_64_only_phone-userdebug
          AB_API_KEY: AIzaSyBIelMvbjtNkpa5O96eqbm_IuSUA5WsO14
        run: |
          set -euo pipefail
          RESP=$(curl -fsSL -H "X-goog-api-key: ${AB_API_KEY}" \
            "https://androidbuild-pa.googleapis.com/v4/builds?buildAttemptStatus=complete&buildType=submitted&pageSize=1&successful=true&branches=${{ env.CUTTLEFISH_BRANCH }}&targets=${TARGET}")
          echo "API response: ${RESP}" | head -c 2000
          echo ""
          BID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['builds'][0]['buildId'])")
          echo "BUILD_ID=$BID" >> $GITHUB_OUTPUT
          echo "Latest build ID: $BID"
      - name: Download Cuttlefish image + host package
        id: download
        env:
          BUILD_ID: ${{ steps.build_id.outputs.BUILD_ID }}
          TARGET: aosp_cf_x86_64_only_phone-userdebug
          AB_API_KEY: AIzaSyBIelMvbjtNkpa5O96eqbm_IuSUA5WsO14
        run: |
          set -euo pipefail
          AB="https://androidbuild-pa.googleapis.com/v4/builds/${BUILD_ID}/${TARGET}/attempts/latest"
          get_signed_url() {
            curl -fsSL -H "X-goog-api-key: ${AB_API_KEY}" "${AB}/artifacts/$1/url" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['signedUrl'])"
          }
          IMG="aosp_cf_x86_64_only_phone-img-${BUILD_ID}.zip"
          PKG="cvd-host_package.tar.gz"
          echo "=== Downloading image: ${IMG} ==="
          IMG_URL=$(get_signed_url "${IMG}")
          curl -fL -o image.zip "${IMG_URL}"
          echo "=== Downloading host package: ${PKG} ==="
          PKG_URL=$(get_signed_url "${PKG}")
          curl -fL -o cvd-host_package.tar.gz "${PKG_URL}"
          echo "=== Unpacking ==="
          unzip -q image.zip -d cuttlefish
          tar -xzf cvd-host_package.tar.gz -C cuttlefish
          echo "=== Directory structure ==="
          ls -la cuttlefish/
          echo "=== Locating cvd binary ==="
          find cuttlefish -name cvd -type f 2>/dev/null || echo "cvd not found"
          CVD_BIN=$(find cuttlefish -name cvd -type f 2>/dev/null | head -1)
          echo "CVD_BIN=${CVD_BIN}"
          echo "CVD_PATH=$(pwd)/cuttlefish" >> $GITHUB_ENV
          dirname "$(dirname "${CVD_BIN}")" > /tmp/cvd_home
          echo "CVD_HOME=$(cat /tmp/cvd_home)" >> $GITHUB_ENV
      - name: Start Cuttlefish
        env:
          CVD_PATH: ${{ env.CVD_PATH }}
          HOME: ${{ env.CVD_HOME }}
        run: |
          set -euo pipefail
          cd "${CVD_PATH}"
          $HOME/bin/cvd start -daemon \
            -gpu_mode=guest_swiftshader \
            -memory_mb=12288 \
            -cpus=4 \
            -enable_gpu=true
          for i in {1..60}; do
            if adb devices | grep -q "device$"; then
              echo "Cuttlefish ready"
              break
            fi
            sleep 2
          done
          adb root
          adb wait-for-device
          adb shell setenforce 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CTS smoke tests
        run: |
          adb shell cmd frozen_sched dump
          python3 tests/cts/test_freeze_thaw.py
          python3 tests/cts/test_mem_budget.py
          python3 tests/cts/test_notif_delivery.py
      - name: Run 10-min accelerated trace (1h logic)
        run: |
          adb shell stop frozen_sched
          adb shell "setprop frozen_sched.time_factor 6"
          adb shell start frozen_sched
          adb shell perfetto -c - -o /data/misc/perfetto/frozen_1h.pftrace --txt <<'EOF'
          duration_ms: 600000
          buffers: { size_kb: 65536 }
          data_sources: { config_name: "android.on_freeze_thaw" }
          data_sources: { config_name: "android.zram_stat" }
          data_sources: { config_name: "android.notification_posted" }
          data_sources: { config_name: "android.notification_delivered" }
          EOF
          sleep 650
      - name: Pull trace & analyze
        run: |
          adb pull /data/misc/perfetto/frozen_1h.pftrace .
          python3 tests/perf/analyze_trace.py frozen_1h.pftrace sim_report.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            report_android.json
            diff_report.txt
            frozen_1h.pftrace
          retention-days: 30
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            report_android.json
            diff_report.txt
            frozen_1h.pftrace
          generate_release_notes: true
